# Vendored from https://github.com/crmne/fastframe tag v0.13.0
# (d5e1a99702f39fda6e252b7acb5582c60becf545).
# Upstream still depends on egui 0.36, and `install` / `Icon::image` use that
# crate's types. This copy depends on egui 0.37 so it matches ytmfast.
# Source is otherwise unchanged. License: MIT AND ISC (see LICENSE and
# icons/lucide/LICENSE.txt).

[package]
name = "fastframe-icons"
description = "Embedded SVG icon sets for egui, with the Lucide icons the apps share"
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
license = "MIT AND ISC"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/fastframe"
homepage = "https://github.com/crmne/fastframe"
readme = "README.md"
keywords = ["egui", "icons", "svg", "lucide"]
categories = ["gui"]
include = ["src", "icons", "tests", "README.md", "Cargo.toml", "LICENSE"]
publish = false

[dependencies]
egui = { version = "0.37", default-features = false }
