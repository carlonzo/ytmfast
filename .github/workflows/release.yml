name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # build only, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup update stable && rustup default stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: tar -czf ytmfast-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/release ytmfast
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ytmfast-*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ytmfast-*.tar.gz --repo "${{ github.repository }}" --generate-notes
