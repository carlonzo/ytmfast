name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # build only, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} needs Cargo.toml version ${GITHUB_REF_NAME#v}, found ${manifest}"
            exit 1
          fi
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup update stable && rustup default stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf ytmfast-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/release ytmfast
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/bundle.sh target/release/ytmfast dist/ytmfast.app "${GITHUB_REF_NAME#v}"
          label="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent dist/ytmfast.app "ytmfast-${label}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ytmfast-*.tar.gz
            ytmfast-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ytmfast-*.tar.gz ytmfast-*.zip --repo "${{ github.repository }}" --generate-notes
